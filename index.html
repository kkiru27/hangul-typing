<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>한글 타자 연습</title>
<link rel="stylesheet" href="css/common.css?v=202610021241">
<link rel="stylesheet" href="css/app.css?v=202610021241">
<link rel="stylesheet" href="css/chunsik.css?v=202610021241">
<link rel="preload" as="image" href="img/chunsik.png?v=202610021241">
<link rel="preload" as="image" href="img/chunsik-goguma.png?v=202610021241">
<link rel="preload" as="image" href="img/chunsik-sad.png?v=202610021241">
</head>
<body>
<!-- 키보드 입력을 받는 숨은 입력칸 (한글 조합은 여기서 일어난다) -->
<input id="ime" class="ime-hidden" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
       spellcheck="false" aria-label="타자 입력">

<div id="app">
  <header class="topbar">
    <div class="top-left">
      <div class="brand" id="brand">한글 타자 연습</div>
      <!-- 처음 화면 안쪽에서는 '처음으로', 연습·게임 중에는 '멈춤' (키보드로는 Esc) -->
      <button type="button" class="nav-btn" id="navBtn" hidden></button>
    </div>
    <div class="top-center">
      <div class="stage-label" id="stageLabel"></div>
      <div class="round-head" id="roundHead" hidden>
        <div class="round-label" id="roundLabel"></div>
        <div class="track" id="track">
          <div class="track-line"><div class="track-fill" id="trackFill"></div></div>
          <div class="track-runner" id="trackRunner"><img src="img/chunsik.png?v=202610021241" alt="" draggable="false"></div>
          <div class="track-goal" id="trackGoal"></div>
        </div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span id="progressLabel">진행</span><b id="progress">–</b></div>
      <div class="stat"><span>정확도</span><b id="accuracy">–</b></div>
      <div class="stat" id="speedStat" hidden><span>타수</span><b id="speed">–</b></div>
    </div>
  </header>

  <main class="stage-area">
    <!-- 처음 화면 -->
    <section id="homeScreen" class="screen home">
      <div class="home-row">
        <div id="homeChunsik"></div>
        <div class="map-wrap">
          <div class="map-total" id="mapTotal"></div>
          <!-- 단계 지도: 방향키로 고르고 Enter로 시작 (카드를 눌러도 시작) -->
          <div class="stage-map" id="stageMap"></div>
          <div class="map-pages" id="mapPages"></div>
          <!-- 처음 화면 설정 줄: ↓ 로 내려와서 ← → 로 고르고 Enter -->
          <div class="home-settings" id="homeSettings" hidden></div>
          <p class="map-tip" id="mapTip"></p>
        </div>
      </div>
      <p class="press-enter" id="homeHint"></p>
      <div class="corner"><a href="test.html">입력 테스트 페이지</a> · <span id="version"></span></div>
    </section>

    <!-- 연습 화면 -->
    <section id="playScreen" class="screen play" hidden>
      <div class="tiles" id="tiles"></div>
      <!-- 낱말 연습: 이번 판 낱말 줄 + 지금 칠 낱말 크게 -->
      <div class="words" id="words" hidden>
        <div class="word-queue" id="wordQueue"></div>
        <div class="word-big" id="wordBig"></div>
      </div>
      <!-- 짧은 글: 지금 문장(글자마다 색) + 다음 문장 미리보기 -->
      <div class="sentence" id="sentence" hidden>
        <div class="sent-big" id="sentBig"></div>
        <div class="sent-next" id="sentNext"></div>
      </div>
      <!-- 긴 글: 앞 줄 · 지금 줄 · 다음 두 줄 -->
      <div class="story" id="story" hidden>
        <div class="story-prev" id="storyPrev"></div>
        <div class="sent-big story-cur" id="storyCur"></div>
        <div class="story-next" id="storyNext"></div>
      </div>
      <!-- 친 글자가 보이는 입력 막대 (검색창처럼) -->
      <div class="typed-bar" id="typedBar">
        <span class="tb-icon" aria-hidden="true">⌨️</span>
        <span class="tb-line"><span class="tb-text" id="typedText"></span><span class="tb-caret"></span></span>
        <span class="tb-hint" id="typedHint">여기에 친 글자가 보여요</span>
      </div>
      <div class="guide">
        <div id="playChunsik"></div>
        <div id="banner" class="banner" hidden>
          <span class="banner-icon" id="bannerIcon"></span>
          <span id="bannerText"></span>
        </div>
        <div class="guide-card" id="guideCard">
          <div class="guide-jamo" id="guideJamo"></div>
          <div class="guide-key" id="guideKey"></div>
        </div>
        <div class="guide-side">
          <div class="guide-finger" id="guideFinger"></div>
        </div>
      </div>
    </section>

    <!-- 게임: 고구마 비 -->
    <section id="gameScreen" class="screen game" hidden>
      <div class="rain" id="rain">
        <div class="rain-ground"></div>
        <div id="gameChunsik" class="game-chunsik"></div>
        <div id="gameBanner" class="banner game-banner" hidden></div>
      </div>
      <div class="typed-bar" id="gameBar">
        <span class="tb-icon" aria-hidden="true">⌨️</span>
        <span class="tb-line"><span class="tb-text" id="gameText"></span><span class="tb-caret"></span></span>
        <span class="tb-hint" id="gameHint">고구마에 적힌 낱말을 치고 스페이스바!</span>
      </div>
    </section>

    <!-- 판 끝 / 단계 끝 -->
    <section id="resultScreen" class="screen result" hidden>
      <div class="result-row">
      <div id="resultChunsik"></div>
      <div class="result-card">
        <div class="result-title" id="resultTitle"></div>
        <div class="result-acc"><span id="resultAccLabel">정확도</span><b id="resultAcc"></b></div>
        <div class="result-goguma" id="resultGoguma" hidden></div>
        <div class="result-note" id="resultNote" hidden></div>
        <div class="result-rounds" id="resultRounds"></div>
        <div class="result-miss" id="resultMiss"></div>
        <p class="press-enter"><kbd>Enter ⏎</kbd> <span id="resultNext"></span></p>
      </div>
      </div>
    </section>
    <!-- 일시정지 창: 연습·게임 중 Esc 또는 ⏸ 단추 -->
    <div class="pause-layer" id="pauseLayer" hidden>
      <div class="pause-card">
        <div class="pause-head">
          <img class="pause-cs" src="img/chunsik.png?v=202610021241" alt="" draggable="false">
          <div>
            <div class="pause-title">잠깐 쉬어요</div>
            <div class="pause-sub" id="pauseSub"></div>
          </div>
        </div>
        <div class="pause-menu" id="pauseMenu"></div>
        <p class="pause-hint"><kbd>↑ ↓</kbd> 고르고 <kbd>Enter ⏎</kbd> · <kbd>Esc</kbd> 계속하기</p>
      </div>
    </div>
  </main>

  <footer class="kbd-area">
    <div id="keyboard"></div>
  </footer>
</div>

<div class="rotate-hint">아이패드를 <b>가로</b>로 돌려 주세요</div>

<script type="module" src="js/app.js?v=202610021241"></script>
</body>
</html>
